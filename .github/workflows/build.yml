name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Build release APK
        env:
          CARL_KEYSTORE: ${{ secrets.CARL_KEYSTORE_BASE64 != '' && 'release.jks' || '' }}
          CARL_KEYSTORE_PASSWORD: ${{ secrets.CARL_KEYSTORE_PASSWORD }}
          CARL_KEY_ALIAS: ${{ secrets.CARL_KEY_ALIAS }}
          CARL_KEY_PASSWORD: ${{ secrets.CARL_KEY_PASSWORD }}
        run: |
          if [ -n "${CARL_KEYSTORE:-}" ]; then
            echo "${{ secrets.CARL_KEYSTORE_BASE64 }}" | base64 -d > release.jks
          fi
          ./gradlew :app:assembleRelease --console=plain

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: open-carl-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
